<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>iTool</title>

<!-- ============================================================
     iTOOL — CINEMATIC LOADER  ·  STYLES
     Paste this block inside <head>
     ============================================================ -->
<style>
  :root{
    --itl-blue:    #1a8cff;
    --itl-blue-lt: #63c7ff;
  }

  /* ---------- OVERLAY SHELL ---------- */
  #itlLoader{
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    opacity: 1;
    transform: translateZ(0);
    transition: opacity .8s cubic-bezier(.4,0,.2,1),
                transform .9s cubic-bezier(.4,0,.2,1);
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    contain: layout style paint;
  }
  #itlLoader.itl-out{
    opacity: 0;
    transform: scale(1.08);
    pointer-events: none;
  }

  /* ---------- PARTICLE CANVAS ---------- */
  #itlLoader .itl-canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    pointer-events: none;
    animation: itlFadeIn 1.4s ease .15s forwards;
  }

  /* ---------- STAGE ---------- */
  #itlLoader .itl-inner{
    position: relative;
    z-index: 2;
    width: min(86vw, 380px);
    text-align: center;
    transform: translateY(-3vh);
  }

  /* ---------- LOGO ---------- */
  #itlLoader .itl-float{
    position: relative;
    animation: itlFloat 6s ease-in-out 1.5s infinite;
    will-change: transform;
  }
  #itlLoader .itl-logo{
    position: relative;
    width: 104px;
    height: 104px;
    margin: 0 auto;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform, opacity;
    animation: itlLogoIn 1.6s cubic-bezier(.16,1,.3,1) both;
  }
  #itlLoader .itl-logo svg{ display: block; width: 100%; height: 100%; }

  /* soft neon bloom behind the mark */
  #itlLoader .itl-glow{
    position: absolute;
    left: 50%; top: 50%;
    width: 260px; height: 260px;
    margin: -130px 0 0 -130px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(26,140,255,.42) 0%,
      rgba(26,140,255,.16) 38%,
      rgba(26,140,255,0)   70%);
    will-change: opacity, transform;
    animation: itlGlowIn 1.8s ease-out .15s both,
               itlBreathe 5s ease-in-out 2s infinite;
  }

  /* ---------- TITLE ---------- */
  #itlLoader .itl-title{
    margin: 38px 0 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: clamp(11px, 3.2vw, 13px);
    font-weight: 600;
    letter-spacing: .42em;
    text-indent: .42em;
    text-transform: uppercase;
    color: #eaf4ff;
    text-shadow: 0 0 18px rgba(99,199,255,.45);
    opacity: 0;
    animation: itlUp .9s cubic-bezier(.16,1,.3,1) .55s both;
    transition: color .45s ease, text-shadow .45s ease;
  }
  #itlLoader .itl-title.itl-ready{
    color: #fff;
    text-shadow: 0 0 22px rgba(99,199,255,.95),
                 0 0 60px rgba(26,140,255,.55);
  }

  /* ---------- PROGRESS BAR ---------- */
  #itlLoader .itl-bar{
    position: relative;
    margin: 24px auto 0;
    height: 6px;
    border: 1px solid rgba(255,255,255,.32);
    border-radius: 999px;
    background: rgba(255,255,255,.025);
    opacity: 0;
    animation: itlUp .9s cubic-bezier(.16,1,.3,1) .7s both;
  }
  #itlLoader .itl-fill{
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg,#0a5cff 0%,#1a8cff 40%,#63c7ff 100%);
    box-shadow: 0 0 6px  rgba(26,140,255,.95),
                0 0 16px rgba(26,140,255,.60),
                0 0 30px rgba(26,140,255,.28);
    will-change: width;
  }
  /* travelling light at the head of the fill */
  #itlLoader .itl-fill::after{
    content: "";
    position: absolute;
    right: 0; top: 50%;
    width: 6px; height: 6px;
    margin-top: -3px;
    border-radius: 50%;
    background: #f2fbff;
    box-shadow: 0 0 8px  #9fe0ff,
                0 0 16px #4db8ff,
                0 0 28px rgba(26,140,255,.9);
  }

  /* ---------- META ROW ---------- */
  #itlLoader .itl-meta{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 14px;
    min-height: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 10.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #6f8ba6;
    opacity: 0;
    animation: itlUp .9s cubic-bezier(.16,1,.3,1) .85s both;
  }
  #itlLoader .itl-status{
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity .25s ease, transform .25s ease;
    will-change: opacity, transform;
  }
  #itlLoader .itl-status.itl-hide{
    opacity: 0;
    transform: translate3d(0,-5px,0);
  }
  #itlLoader .itl-pct{
    flex: none;
    color: #dff0ff;
    font-weight: 700;
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(77,184,255,.75);
  }

  /* ---------- KEYFRAMES ---------- */
  @keyframes itlLogoIn{
    0%   { opacity: 0; transform: perspective(900px) rotateY(-170deg) rotateX(28deg) scale(.42); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: perspective(900px) rotateY(0deg) rotateX(0deg) scale(1); }
  }
  @keyframes itlGlowIn{
    from { opacity: 0;  transform: scale(.55); }
    to   { opacity: .9; transform: scale(1); }
  }
  @keyframes itlBreathe{
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.14); }
  }
  @keyframes itlFloat{
    0%, 100% { transform: translate3d(0,0,0); }
    50%      { transform: translate3d(0,-8px,0); }
  }
  @keyframes itlUp{
    from { opacity: 0; transform: translate3d(0,14px,0); }
    to   { opacity: 1; transform: translate3d(0,0,0); }
  }
  @keyframes itlFadeIn{
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ---------- PREMIUM SITE REVEAL ---------- */
  /* Remove this block if you prefer an instant reveal. */
  html.itl-ready body > *:not(#itlLoader):not(script):not(style):not(link){
    animation: itlReveal .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes itlReveal{
    from { opacity: 0; transform: translate3d(0,16px,0); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 420px){
    #itlLoader .itl-logo{ width: 84px; height: 84px; }
    #itlLoader .itl-glow{ width: 210px; height: 210px; margin: -105px 0 0 -105px; }
    #itlLoader .itl-title{ letter-spacing: .3em; text-indent: .3em; margin-top: 30px; }
    #itlLoader .itl-meta{ font-size: 9.5px; letter-spacing: .14em; }
  }

  /* ---------- ACCESSIBILITY ---------- */
  @media (prefers-reduced-motion: reduce){
    #itlLoader .itl-logo,
    #itlLoader .itl-float,
    #itlLoader .itl-glow,
    #itlLoader .itl-title,
    #itlLoader .itl-bar,
    #itlLoader .itl-meta{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    #itlLoader .itl-canvas{ display: none; }
    html.itl-ready body > *:not(#itlLoader){ animation: none !important; }
  }
</style>
</head>

<body>

<!-- ============================================================
     iTOOL — CINEMATIC LOADER  ·  MARKUP
     Must be the FIRST element inside <body>
     ============================================================ -->
<div id="itlLoader" role="status" aria-live="polite" aria-label="Loading iTool">

  <canvas id="itlCanvas" class="itl-canvas" aria-hidden="true"></canvas>

  <div class="itl-inner">

    <!-- ===== LOGO (swap the <svg> for your existing <img> if you prefer) ===== -->
    <div class="itl-float">
      <div class="itl-glow" aria-hidden="true"></div>
      <div class="itl-logo">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="itlStroke" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffffff"/>
              <stop offset="0.5" stop-color="#a9dcff"/>
              <stop offset="1" stop-color="#1a8cff"/>
            </linearGradient>
            <linearGradient id="itlStem" x1="54" y1="57" x2="66" y2="87" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffffff"/>
              <stop offset="1" stop-color="#4db8ff"/>
            </linearGradient>
          </defs>
          <path d="M60 6 L106 32 L106 88 L60 114 L14 88 L14 32 Z"
                stroke="url(#itlStroke)" stroke-width="2.5"
                stroke-linejoin="round" opacity="0.95"/>
          <path d="M60 20 L94 39 L94 81 L60 100 L26 81 L26 39 Z"
                stroke="#1a8cff" stroke-width="1"
                stroke-linejoin="round" opacity="0.35"/>
          <circle cx="60" cy="44" r="6.5" fill="#ffffff"/>
          <rect x="54.5" y="57" width="11" height="30" rx="5.5" fill="url(#itlStem)"/>
        </svg>
      </div>
    </div>

    <!-- ===== TITLE ===== -->
    <h1 class="itl-title" id="itlTitle">Initializing iTool…</h1>

    <!-- ===== PROGRESS BAR ===== -->
    <div class="itl-bar">
      <div class="itl-fill" id="itlFill"></div>
    </div>

    <!-- ===== STATUS + PERCENTAGE ===== -->
    <div class="itl-meta">
      <span class="itl-status" id="itlStatus">Initializing Interface</span>
      <span class="itl-pct" id="itlPct">0%</span>
    </div>

  </div>
</div>

<!-- ============================================================
     YOUR EXISTING iTOOL WEBSITE CONTENT GOES HERE (UNCHANGED)
     ============================================================ -->
<main id="site">
  <h1 style="color:#fff;font-family:sans-serif;text-align:center;padding-top:40vh;">
    Your iTool website content
  </h1>
</main>

<!-- ============================================================
     iTOOL — CINEMATIC LOADER  ·  SCRIPT
     Paste just before </body>
     ============================================================ -->
<script>
(function () {
  'use strict';

  var doc    = document;
  var root   = doc.documentElement;
  var loader = doc.getElementById('itlLoader');
  if (!loader) return;

  var fill     = doc.getElementById('itlFill');
  var pctEl    = doc.getElementById('itlPct');
  var statusEl = doc.getElementById('itlStatus');
  var titleEl  = doc.getElementById('itlTitle');
  var canvas   = doc.getElementById('itlCanvas');

  /* ---------------- CONFIG ---------------- */
  var MIN_TIME    = 1600;  // minimum time the loader stays visible (ms)
  var HARD_LIMIT  = 9000;  // fallback: force completion after this (ms)
  var FINISH_HOLD = 700;   // pause on "SYSTEM READY" before fading out (ms)

  var startTime = perfNow();
  var progress  = 0;
  var shownPct  = -1;
  var statusIdx = -1;
  var ready     = false;   // page fully loaded?
  var done      = false;   // loader finished?
  var boost     = 0;       // externally reported progress
  var rafId     = null;
  var lastTs    = startTime;
  var swapTimer = null;

  var STATUS = [
    { at: 0,  text: 'Initializing Interface' },
    { at: 26, text: 'Loading Components' },
    { at: 52, text: 'Preparing Tools' },
    { at: 74, text: 'Optimizing Experience' },
    { at: 93, text: 'Almost Ready' }
  ];

  function perfNow() {
    return (window.performance && performance.now)
      ? performance.now()
      : Date.now();
  }

  /* ---------------- SCROLL LOCK ---------------- */
  var prevHtmlOverflow = root.style.overflow;
  var prevBodyOverflow = doc.body ? doc.body.style.overflow : '';
  root.style.overflow = 'hidden';
  if (doc.body) doc.body.style.overflow = 'hidden';

  function unlockScroll() {
    root.style.overflow = prevHtmlOverflow;
    if (doc.body) doc.body.style.overflow = prevBodyOverflow;
  }

  /* ---------------- PARTICLE FIELD ---------------- */
  var Particles = (function () {
    var reduce = window.matchMedia &&
                 window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!canvas || !canvas.getContext || reduce) {
      return { start: function () {}, stop: function () {} };
    }

    var ctx  = canvas.getContext('2d', { alpha: true });
    var dpr  = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0, parts = [], sprite = null;
    var running = false, id = null, t0 = 0;

    function makeSprite() {
      var s = 64;
      var c = doc.createElement('canvas');
      c.width = c.height = s;
      var g = c.getContext('2d');
      var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      grad.addColorStop(0.00, 'rgba(255,255,255,1)');
      grad.addColorStop(0.18, 'rgba(200,235,255,0.90)');
      grad.addColorStop(0.42, 'rgba(60,165,255,0.35)');
      grad.addColorStop(1.00, 'rgba(26,140,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, s, s);
      return c;
    }

    function spawn(initial) {
      return {
        x:  Math.random() * W,
        y:  initial ? Math.random() * H : H + 20,
        r:  0.7 + Math.random() * 1.9,
        vx: (Math.random() - 0.5) * 0.14,
        vy: -(0.06 + Math.random() * 0.22),
        a:  0.25 + Math.random() * 0.60,
        tw: 0.6 + Math.random() * 1.8,
        ph: Math.random() * Math.PI * 2
      };
    }

    function build() {
      var n = Math.round((W * H) / 24000);
      n = Math.max(16, Math.min(64, n));
      parts = [];
      for (var i = 0; i < n; i++) parts.push(spawn(true));
    }

    function resize() {
      W = canvas.clientWidth  || window.innerWidth;
      H = canvas.clientHeight || window.innerHeight;
      canvas.width  = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build();
    }

    function loop(ts) {
      if (!running) return;
      if (!t0) t0 = ts;
      var t = (ts - t0) / 1000;

      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.y < -30)      { p.y = H + 20; p.x = Math.random() * W; }
        if (p.x < -30)      p.x = W + 20;
        if (p.x > W + 30)   p.x = -20;

        var tw = 0.55 + 0.45 * Math.sin(t * p.tw + p.ph);
        ctx.globalAlpha = p.a * tw;

        var s = p.r * 7;
        ctx.drawImage(sprite, p.x - s / 2, p.y - s / 2, s, s);
      }

      ctx.globalAlpha = 1;
      id = requestAnimationFrame(loop);
    }

    function start() {
      if (running || done) return;
      if (!sprite) sprite = makeSprite();
      resize();
      running = true;
      id = requestAnimationFrame(loop);
    }

    function stop() {
      running = false;
      if (id) cancelAnimationFrame(id);
      id = null;
    }

    var rzTimer = null;
    window.addEventListener('resize', function () {
      if (!running) return;
      clearTimeout(rzTimer);
      rzTimer = setTimeout(resize, 200);
    }, { passive: true });

    doc.addEventListener('visibilitychange', function () {
      if (doc.hidden) {
        stop();
      } else if (!done) {
        running = false;
        start();
      }
    });

    return { start: start, stop: stop };
  })();

  /* ---------------- LOAD SIGNALS ---------------- */

  function markReady() { ready = true; }

  if (doc.readyState === 'complete') markReady();
  else window.addEventListener('load', markReady, { once: true });

  /* Optional public hook — let other scripts report progress:
     window.itoolProgress(45);  // 0–100                                */
  window.itoolProgress = function (v) {
    v = Number(v);
    if (!isFinite(v)) return;
    v = Math.max(0, Math.min(100, v));
    if (v >= 100) markReady();
    else if (v > boost) boost = v;
  };

  function computeTarget(elapsed) {
    if (ready) return 100;
    var domParsed = doc.readyState !== 'loading' ? 55 : 0;
    // smooth asymptotic creep — never stalls, never fakes 100
    var creep = 96 * (1 - Math.exp(-elapsed / 2600));
    return Math.max(domParsed, creep, boost);
  }

  /* ---------------- STATUS TEXT ---------------- */

  function swapStatus(text) {
    if (!statusEl) return;
    clearTimeout(swapTimer);
    statusEl.classList.add('itl-hide');
    swapTimer = setTimeout(function () {
      statusEl.textContent = text;
      statusEl.classList.remove('itl-hide');
    }, 180);
  }

  function setStatusFor(pct) {
    var idx = 0;
    for (var i = 0; i < STATUS.length; i++) {
      if (pct >= STATUS[i].at) idx = i;
    }
    if (idx === statusIdx) return;
    statusIdx = idx;
    swapStatus(STATUS[idx].text);
  }

  /* ---------------- RENDER ---------------- */

  function render(p) {
    if (fill) fill.style.width = p.toFixed(2) + '%';

    var pct = Math.floor(p);
    if (p >= 99.5) pct = 100;
    if (pct > 100) pct = 100;

    if (pct !== shownPct) {
      shownPct = pct;
      if (pctEl) pctEl.textContent = pct + '%';
      setStatusFor(pct);
    }
  }

  /* ---------------- FRAME LOOP ---------------- */

  function frame() {
    if (done) return;

    var ts      = perfNow();
    var dt      = Math.min((ts - lastTs) / 1000, 0.05); // clamp after tab-switch
    lastTs      = ts;
    var elapsed = ts - startTime;

    // fallback: never hang on a slow/broken connection
    if (!ready && elapsed > HARD_LIMIT) ready = true;

    var target = computeTarget(elapsed);
    var alpha  = 1 - Math.exp(-dt * 5);   // frame-rate independent easing

    progress += (target - progress) * alpha;

    // crisp landing on 100 — never stuck at 99
    if (target >= 100 && progress > 99.2) progress = 100;

    render(progress);

    if (progress >= 100 && elapsed >= MIN_TIME) {
      finish();
      return;
    }

    rafId = requestAnimationFrame(frame);
  }

  /* ---------------- FINISH ---------------- */

  function finish(instant) {
    if (done) return;
    done = true;

    if (rafId) cancelAnimationFrame(rafId);
    Particles.stop();

    render(100);
    if (fill)   fill.style.width = '100%';
    if (pctEl)  pctEl.textContent = '100%';

    if (titleEl) {
      titleEl.textContent = 'SYSTEM READY';
      titleEl.classList.add('itl-ready');
    }
    swapStatus('All Systems Operational');

    setTimeout(function () {
      loader.classList.add('itl-out');
      root.classList.add('itl-ready');
      unlockScroll();

      setTimeout(function () {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
        window.dispatchEvent(new Event('itool:loaded'));
      }, 950);

    }, instant ? 0 : FINISH_HOLD);
  }

  /* ---------------- bfcache GUARD ----------------
     Never re-show the loader on back/forward navigation. */
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) finish(true);
  });

  /* ---------------- GO ---------------- */
  Particles.start();
  rafId = requestAnimationFrame(frame);

})();
</script>

</body>
</html>
