<!doctype html>
<html lang="en" data-theme="snow" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UtilityHub — 130 everyday tools</title>
<meta name="description" content="PDF, image, text, calculator, file, developer and daily-life tools in one place.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141417'/%3E%3Cpath d='M21 18 V34 Q21 47 32 47 Q43 47 43 34 V18' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="logo-mark.svg">
<link rel="stylesheet" href="styles.css">
<script>
  /* paint theme before first frame — no white flash on a dark-mode load */
  try {
    var theme = JSON.parse(localStorage.getItem('uh.theme') || '"snow"');
    var mode = JSON.parse(localStorage.getItem('uh.mode') || '"auto"');
    var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.mode = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
</head>
<body>

<!-- ================= SPLASH ================= -->
<div id="splash" data-duration="5500" role="status" aria-label="UtilityHub loading">
  <div class="sp-inner">
    <svg class="sp-glyph" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M18 14 V32 Q18 50 32 50 Q46 50 46 32 V14"
            stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
            fill="none" pathLength="1"/>
    </svg>
    <div class="sp-name">Utility<b>Hub</b></div>
    <div class="sp-tag">Every ordinary digital task, one place.</div>
  </div>
  <div class="sp-bar"><i></i></div>
  <button class="sp-skip" type="button" aria-label="Skip intro">Skip</button>
</div>
<!-- ========================================== -->

<header class="top">
  <button class="icon-btn" id="navToggle" aria-label="Menu">☰</button>
  <a class="brand" href="#/">
    <svg class="mark-svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M18 14 V32 Q18 50 32 50 Q46 50 46 32 V14"
            stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="brand-name">UtilityHub</span>
  </a>
  <div class="search-wrap">
    <input id="search" class="search" type="search" placeholder="Search 130 tools…  (press /)" autocomplete="off" aria-label="Search tools">
    <kbd class="kbd">/</kbd>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Change theme">◐</button>
</header>

<div class="shell">
  <aside class="side" id="side">
    <nav id="cats" class="cats"></nav>
    <div class="side-foot">
      <a href="#/favorites" class="side-link">Favorites</a>
      <a href="#/recent" class="side-link">Recently used</a>
    </div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div class="theme-pop" id="themePop" hidden>
  <p class="tp-title">Theme</p>
  <div id="themeList" class="tp-list"></div>
  <p class="tp-title">Mode</p>
  <div class="tp-modes">
    <button data-mode="light" class="chip">Light</button>
    <button data-mode="dark" class="chip">Dark</button>
    <button data-mode="auto" class="chip">Auto</button>
  </div>
</div>

<script src="app.js" defer></script>
<script src="tools/text-data.js" defer></script>
<script src="tools/calc-daily.js" defer></script>
<script src="tools/prod-net.js" defer></script>
<script src="tools/image-pdf.js" defer></script>
</body>
</html>
