<!doctype html>
<html lang="en" data-theme="snow" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iHub — 130 everyday tools</title>
<meta name="description" content="PDF, image, text, calculator, file, developer and daily-life tools in one place.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141417'/%3E%3Ccircle cx='32' cy='18' r='6' fill='%23ffffff'/%3E%3Cline x1='32' y1='30' x2='32' y2='52' stroke='%23ffffff' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="logo-mark.svg">
<link rel="stylesheet" href="styles.css">
<script>
  try {
    var theme = JSON.parse(localStorage.getItem('uh.theme') || '"snow"');
    var mode = JSON.parse(localStorage.getItem('uh.mode') || '"auto"');
    var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.mode = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
</head>
<body>

<div id="splash" data-duration="6600" role="status" aria-label="iHub loading">
  <div class="sp-stage">
    <div class="sp-lockup">
      <div class="sp-mark-slot">
        <svg class="sp-mark" viewBox="0 0 64 64" overflow="visible" aria-hidden="true">
          <circle class="sp-ripple r1" cx="32" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle class="sp-ripple r2" cx="32" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle class="sp-ripple r3" cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <circle class="sp-dot" cx="32" cy="16" r="7" fill="currentColor"/>
          <line class="sp-stem" x1="32" y1="30" x2="32" y2="54" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="sp-word" aria-hidden="true">
        <span class="sp-char">H</span><span class="sp-char">u</span><span class="sp-char">b</span>
      </div>
    </div>
    <div class="sp-underline" aria-hidden="true"></div>
    <div class="sp-tag">Every tool. One place.</div>
  </div>
</div>

<header class="top">
  <button class="icon-btn" id="navToggle" aria-label="Menu">☰</button>
  <a class="brand" href="#/" aria-label="iHub home">
    <svg class="mark-svg" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="16" r="7" fill="currentColor"/>
      <line x1="32" y1="30" x2="32" y2="54" stroke="currentColor" stroke-width="14" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">iHub</span>
  </a>
  <div class="search-wrap">
    <input id="search" class="search" type="search" placeholder="Search 130 tools…  (press /)" autocomplete="off" aria-label="Search tools">
    <kbd class="kbd">/</kbd>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Change theme">◐</button>
</header>

<div class="shell">
  <aside class="side" id="side">
    <nav id="cats" class="cats"></nav>
    <div class="side-foot">
      <a href="#/favorites" class="side-link">Favorites</a>
      <a href="#/recent" class="side-link">Recently used</a>
    </div>
  </aside>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<div class="theme-pop" id="themePop" hidden>
  <p class="tp-title">Theme</p>
  <div id="themeList" class="tp-list"></div>
  <p class="tp-title">Mode</p>
  <div class="tp-modes">
    <button data-mode="light" class="chip">Light</button>
    <button data-mode="dark" class="chip">Dark</button>
    <button data-mode="auto" class="chip">Auto</button>
  </div>
</div>

<script src="app.js" defer></script>
<script src="tools/text-data.js" defer></script>
<script src="tools/calc-daily.js" defer></script>
<script src="tools/prod-net.js" defer></script>
<script src="tools/image-pdf.js" defer></script>
</body>
</html>
